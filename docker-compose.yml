version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: workpulse-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: workpulse

  backend:
    build: ./backend
    container_name: workpulse-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/workpulse
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      VOICE_SERVICE_URL: http://voice-service:8000

  voice-service:
    build: ./voice-service
    container_name: workpulse-voice
    restart: unless-stopped
    ports:
      - "${VOICE_PORT:-8000}:8000"
    environment:
      PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000}

  # frontend:
  #   build: ./frontend
  #   container_name: workpulse-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:3000"
  #   depends_on:
  #     - backend
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
  #     NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

volumes:
  mongo-data:
